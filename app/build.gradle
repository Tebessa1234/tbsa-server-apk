plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.tbsa.serveur'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.tbsa.serveur'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }
    signingConfigs {
        debug {
            storeFile file('tbsa-stable.jks')
            storePassword 'tbsa1234'
            keyAlias 'tbsa'
            keyPassword 'tbsa1234'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
